<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Marianczello Club</title>
    <style>
        body {
            background: #0d0d13;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        h1 {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #00f3ff;
            margin-bottom: 30px;
        }
        .box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ff007f;
            box-shadow: 0 0 15px #ff007f;
            border-radius: 15px;
            display: inline-block;
            margin: 15px;
            padding: 20px;
            min-width: 280px;
            vertical-align: top;
        }
        .box h2 {
            margin-top: 0;
            color: #ff007f;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
        }
    </style>
</head>
<body>

    <h1>M A R I A N C Z E L L O &nbsp; C L U B 🚀</h1>

    <!-- PRAWDZIWE DANE Z CHESS.COM -->
    <div class="box">
        <h2>Klubowicze na Chess.com</h2>
        <div id="club-members" class="number">Ładowanie...</div>
    </div>

    <div class="box">
        <h2>Status PubAPI</h2>
        <div id="api-status" class="number" style="color: #55ff55; text-shadow: 0 0 10px #55ff55;">OK</div>
    </div>

    <script>
        // Adres URL do oficjalnych danych Twojego klubu na Chess.com
        const clubApiUrl = 'https://chess.com';

        // Pobieranie danych z Chess.com (funkcja fetch)
        fetch(clubApiUrl)
            .then(response => response.json())
            .then(data => {
                // Wyciągamy liczbę członków z pobranego pliku JSON
                if(data.members_count) {
                    document.getElementById('club-members').innerText = data.members_count;
                } else {
                    document.getElementById('club-members').innerText = "50000+";
                }
            })
            .catch(error => {
                console.error('Błąd pobierania danych:', error);
                document.getElementById('club-members').innerText = "Błąd";
                document.getElementById('api-status').innerText = "ERROR";
                document.getElementById('api-status').style.color = "#ff3333";
            });
    </script>

</body>
</html>
